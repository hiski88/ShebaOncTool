name: Apply radiation update command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  update:
    if: github.event.issue.pull_request && github.event.issue.number == 1 && github.event.comment.body == '/apply-radiation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiation-columns-update
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply C-D-E radiation mapping
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('config/oncology.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['schema_version'] = 2
          for slot, index in enumerate((2, 3, 4), start=1):
              column = next(item for item in config['schedule']['columns'] if int(item['index']) == index)
              column.update(source_code='radiation', label='קרינה', kind='station', slot=slot)

          aliases = config.setdefault('activity_aliases', [])
          if not any(item.get('code') == 'radiation' for item in aliases):
              position = next((i for i, item in enumerate(aliases) if item.get('code') == 'department_regular'), len(aliases))
              aliases.insert(position, {'terms': ['קרינה'], 'code': 'radiation', 'label': 'קרינה', 'kind': 'task'})

          terms = config.setdefault('non_name_terms', [])
          if 'קרינה' not in terms:
              position = terms.index('מרפאות') if 'מרפאות' in terms else len(terms)
              terms.insert(position, 'קרינה')

          config.setdefault('task_labels', {})['radiation'] = 'קרינה'
          config.setdefault('event_defaults', {})['radiation'] = {'all_day': True, 'create': True}
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          excel_path = Path('excel_tools.py')
          text = excel_path.read_text(encoding='utf-8')
          text = text.replace('(4, 6, "מעקב אישי"),', '(4, 6, "קרינה"),', 1)
          excel_path.write_text(text, encoding='utf-8')

          parser_path = Path('schedule_parser.py')
          text = parser_path.read_text(encoding='utf-8')
          if '("קרינה", {"radiation"}),' not in text:
              old = '    ("תורנות אשפוז יום", {"day_hospital_duty"}),\n    ("מיון יום", {"oncology_er"}),\n'
              new = '    ("תורנות אשפוז יום", {"day_hospital_duty"}),\n    ("קרינה", {"radiation"}),\n    ("מיון יום", {"oncology_er"}),\n'
              if old not in text:
                  raise RuntimeError('Summary insertion point not found')
              text = text.replace(old, new, 1)
          parser_path.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          text = readme_path.read_text(encoding='utf-8')
          text = text.replace(
              '- פענוח מיון אונקולוגי, אשפוז יום, אבחון מהיר, תגבור מיון, מרפאות, כוננויות ותורנויות.',
              '- פענוח קרינה, מיון אונקולוגי, אשפוז יום, אבחון מהיר, תגבור מיון, מרפאות, כוננויות ותורנויות.',
          )
          text = text.replace('- מעקב אישי\n', '- קרינה - 3 עמדות\n')
          readme_path.write_text(text, encoding='utf-8')

          Path('tests/test_radiation_columns.py').write_text('''from io import BytesIO
from pathlib import Path
from openpyxl import load_workbook
from core import load_config
from excel_tools import build_schedule_template
from schedule_parser import parse_schedule, read_schedule_workbook, summarize_schedule

ROOT = Path(__file__).resolve().parents[1]
CONFIG = load_config(ROOT / "config" / "oncology.json")


def test_columns_c_d_e_are_radiation():
    columns = {int(item["index"]): item for item in CONFIG["schedule"]["columns"] if int(item["index"]) in {2, 3, 4}}
    assert set(columns) == {2, 3, 4}
    assert all(item["source_code"] == "radiation" for item in columns.values())
    assert all(item["label"] == "קרינה" for item in columns.values())
    assert [columns[index]["slot"] for index in (2, 3, 4)] == [1, 2, 3]
    raw = build_schedule_template(2026, 8, CONFIG)
    workbook = load_workbook(BytesIO(raw))
    sheet = workbook["סידור עבודה"]
    assert sheet["D3"].value == "קרינה"
    assert "D3:F3" in {str(item) for item in sheet.merged_cells.ranges}
    sheet["D4"] = "עובד א"
    sheet["E4"] = "עובד ב"
    sheet["F4"] = "עובד ג"
    buffer = BytesIO()
    workbook.save(buffer)
    parsed = read_schedule_workbook(buffer.getvalue(), "radiation.xlsx")
    records = parse_schedule(parsed, CONFIG, ["עובד א", "עובד ב", "עובד ג"])
    radiation = records[(records["record_type"] == "task") & (records["task_code"] == "radiation")]
    assert set(radiation["employee"]) == {"עובד א", "עובד ב", "עובד ג"}
    assert set(summarize_schedule(records)["קרינה"]) == {1}
''', encoding='utf-8')
          PY
      - name: Compile and test
        run: |
          python -m compileall app.py core.py excel_tools.py schedule_parser.py google_calendar.py
          pytest -q
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/oncology.json excel_tools.py schedule_parser.py README.md tests/test_radiation_columns.py
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'Map columns C-D-E to radiation'
          git push origin HEAD:radiation-columns-update
